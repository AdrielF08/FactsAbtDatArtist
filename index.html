<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>FactsAbtDatArtist</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main id="app">
    <section id="login" hidden>
      <h1>FactsAbtDatArtist</h1>
      <p>Connect your music and get a surprising fact about whoever is playing.</p>
      <button id="connect">Connect Spotify</button>
    </section>

    <section id="player" hidden>
      <p id="source" class="source"></p>
      <h2 id="artist"></h2>
      <p id="fact" class="fact" aria-live="polite"></p>
      <p id="credit" class="credit"></p>
      <div class="actions">
        <button id="another">Another fact</button>
        <button id="shuffle" class="ghost">Different artist</button>
        <button id="follow" class="ghost" hidden>Follow what's playing</button>
        <button id="logout" class="ghost">Disconnect</button>
      </div>
    </section>

    <p id="error" role="alert" hidden></p>
  </main>
  <script type="module" src="src/main.js"></script>
</body>
</html>
